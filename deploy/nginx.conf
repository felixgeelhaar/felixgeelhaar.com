# Serves the Astro `build.format: 'file'` output: pages are emitted as
# /about.html etc. while internal links are extension-less (/about) —
# GH Pages resolves that implicitly, nginx needs try_files.
server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # v1 IA redirects (brand docs/ia.md disposition table): old
    # top-level routes 301 to their new homes. Astro also emits
    # meta-refresh pages for these, but a server-side 301 is canonical.
    location = /lab   { return 301 /work; }
    location = /talks { return 301 /work; }
    location = /about { return 301 /; }
    location = /now   { return 301 /; }
    location = /uses  { return 301 /; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Hashed Astro assets are immutable.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
