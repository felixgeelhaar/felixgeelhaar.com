apiVersion: rollops.klarlabs.de/v1
kind: RolloutConfig
metadata:
  name: website-site
spec:
  target:
    kind: kubernetes
    ref: website/prod/site
    criticality: medium
    spec:
      namespace: website
      resource: deployment/site
      image: ghcr.io/felixgeelhaar/felixgeelhaar-com:v0.2.0
      manifest: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          labels:
            app: site
          name: site
          namespace: website
        spec:
          progressDeadlineSeconds: 600
          replicas: 2
          revisionHistoryLimit: 10
          selector:
            matchLabels:
              app: site
          strategy:
            rollingUpdate:
              maxSurge: 25%
              maxUnavailable: 25%
            type: RollingUpdate
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/restartedAt: '2026-06-05T23:05:31+02:00'
              labels:
                app: site
            spec:
              containers:
              - image: ghcr.io/felixgeelhaar/felixgeelhaar-com:v0.2.0
                imagePullPolicy: IfNotPresent
                livenessProbe:
                  failureThreshold: 3
                  httpGet:
                    path: /
                    port: 8080
                    scheme: HTTP
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  successThreshold: 1
                  timeoutSeconds: 1
                name: site
                ports:
                - containerPort: 8080
                  protocol: TCP
                readinessProbe:
                  failureThreshold: 3
                  httpGet:
                    path: /
                    port: 8080
                    scheme: HTTP
                  initialDelaySeconds: 2
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 1
                resources:
                  limits:
                    cpu: 200m
                    memory: 64Mi
                  requests:
                    cpu: 10m
                    memory: 16Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                terminationMessagePath: /dev/termination-log
                terminationMessagePolicy: File
              dnsPolicy: ClusterFirst
              imagePullSecrets:
              - name: ghcr-pull
              restartPolicy: Always
              schedulerName: default-scheduler
              securityContext:
                runAsNonRoot: true
                runAsUser: 101
                seccompProfile:
                  type: RuntimeDefault
              terminationGracePeriodSeconds: 30
              topologySpreadConstraints:
              - labelSelector:
                  matchLabels:
                    app: site
                maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
  strategy:
    type: rolling
  verification: shallow
  imagePolicy:
    mode: minor
