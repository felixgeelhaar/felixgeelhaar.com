<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icon sprite — Lucide-derived paths (ISC license).

  Each <symbol> exposes a 24x24 viewBox with `currentColor` strokes so
  CSS controls colour and the icon size scales by setting width+height
  on the consuming <svg>. Stroke width is unitless on the symbol so
  the rendered weight stays optically consistent across sizes (1.5 at
  24px reads correct down to 16px).

  Add a new icon by appending another <symbol id="…">. Keep the
  viewBox at 24x24 and the stroke attributes inside the symbol so
  consumers stay attribute-free.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">

  <!-- ── Navigation ─────────────────────────────────────────────── -->
  <symbol id="arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12h14"/>
    <path d="m12 5 7 7-7 7"/>
  </symbol>

  <symbol id="arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5"/>
    <path d="m12 19-7-7 7-7"/>
  </symbol>

  <symbol id="arrow-up-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 7h10v10"/>
    <path d="M7 17 17 7"/>
  </symbol>

  <symbol id="chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m6 9 6 6 6-6"/>
  </symbol>

  <symbol id="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m9 18 6-6-6-6"/>
  </symbol>

  <symbol id="menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
