<?xml version="1.0" encoding="UTF-8"?>
<!--
  Monogram v2 — "FG, mono-stroke, rounded".

  Companion to the slash-bracket symbol. Same construction language
  (single stroke weight, grid-aligned, square frame for app icons +
  favicons) but warmer:

    - rounded line-caps + joins instead of square (less blueprint-y,
      more human)
    - F and G drawn as continuous mono-strokes, optically balanced on
      a 32-unit width each
    - G's spur is the accent stroke (--monogram-accent), echoing the
      slash in the wordmark + the slash in the symbol

  Scales cleanly down to 16x16 (line weight stays ≥2px at favicon
  size). currentColor on the letterforms; accent token on the spur.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Felix Geelhaar monogram">
  <title>Felix Geelhaar monogram</title>
  <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- F : vertical stem + top bar + mid bar -->
    <path d="M 10 14 L 10 50"/>
    <path d="M 10 14 L 26 14"/>
    <path d="M 10 30 L 22 30"/>
    <!-- G : open C-shape (top, left stem, bottom) -->
    <path d="M 54 16 L 38 16 L 38 48 L 54 48"/>
  </g>
  <!-- G spur — accent stroke (echoes the wordmark slash) -->
  <path d="M 54 48 L 54 34 L 44 34"
        fill="none"
        stroke="var(--monogram-accent, #0050F5)"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
