<?xml version="1.0" encoding="UTF-8"?>
<!--
  Wordmark — A2 compact. The inline lockup at body-text cadence.

  Same A2 construction as logotype.svg (slash between name halves) but
  sized for 24 px line height so it slots inline with the system's
  fs-100 paragraph. Use in: footer copyright lines, inline references
  in body prose, email signatures.

  Use logotype.svg when you need the hero version (28 px line height).
  Use masthead.svg when you need the stacked cover variant.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="28" viewBox="0 0 180 28" role="img" aria-label="Felix Geelhaar">
  <title>Felix Geelhaar</title>
  <style>
    .name  { font: 500 16px/1 "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.04em; fill: currentColor; }
    .slash { font: 700 22px/1 "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--wordmark-accent, #0050F5); }
  </style>
  <text class="name"  x="0"  y="20">FELIX</text>
  <text class="slash" x="60" y="22">/</text>
  <text class="name"  x="78" y="20">GEELHAAR</text>
</svg>
