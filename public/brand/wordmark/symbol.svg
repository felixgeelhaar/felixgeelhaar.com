<!--
  Symbol mark v2 - "fg." tile (brand v1, "Studio Grotesk").

  Lowercase fg + cobalt full stop on the ink tile. Square-container
  mark: favicon, app icon, social avatar. Glyphs outlined from
  Schibsted Grotesk Black; renders without webfonts.

  - -symbol-bg overrides the tile (defaults ink-900)
  - -symbol-accent overrides the period (defaults cobalt)
  Letterforms fixed white: the tile guarantees contrast.
-->
